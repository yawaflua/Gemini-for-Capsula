<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Copyright 2026 The Marusya-Gemini Authors.
  SPDX-License-Identifier: Apache-2.0

  System bus policy for marusya-agent (ru.marusya.Agent): the LED ring,
  the 7-segment display and the sensors of the speaker.
  Install as /etc/dbus-1/system.d/ru.marusya.Agent.conf and reload D-Bus
  (rc-service dbus reload).

  root and the "marusya" group may drive the ring and the display; anyone
  may read the properties and listen to the signals.
-->
<busconfig>
  <policy user="root">
    <allow own="ru.marusya.Agent"/>
    <allow send_destination="ru.marusya.Agent"/>
  </policy>
  <policy group="marusya">
    <allow send_destination="ru.marusya.Agent"/>
  </policy>
  <policy context="default">
    <allow send_destination="ru.marusya.Agent"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="ru.marusya.Agent"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="ru.marusya.Agent"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
  </policy>
</busconfig>
