# /etc/spotifyd.conf for the spotify_play skill: spotifyd 0.4+ on the system
# D-Bus (there is no desktop session bus on the speaker).
[global]
device_name = "Marusya"
backend = "alsa"
device = "default"          # через asound.conf, вместе с эквалайзером
use_mpris = true
dbus_type = "system"
cache_path = "/var/cache/spotifyd"   # здесь сохраняется вход
